<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chess Trainer{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">Chess Trainer</a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/train" class="nav-link">Train</a>
            <a href="/stats" class="nav-link">Stats</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/vendor/chess.min.js"></script>
    <script src="/static/vendor/chessboard-1.0.0.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
