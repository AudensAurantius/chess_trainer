<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chess Trainer{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#161512">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/vendor/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% if show_nav is not defined or show_nav != false %}
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">Chess Trainer</a>
        </div>
        <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox">
        <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu">
            <span class="nav-toggle-icon"></span>
        </label>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/import" class="nav-link">Import</a>
            <a href="/create" class="nav-link">Create</a>
            <a href="/train" class="nav-link">Train</a>
            <a href="/bundles" class="nav-link">Bundles</a>
            <a href="/stats" class="nav-link">Stats</a>
            {% if user %}
            <span class="nav-user">{{ user.username }}</span>
            <form method="post" action="/logout" class="nav-logout">
                <button type="submit" class="nav-link">Logout</button>
            </form>
            {% endif %}
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/vendor/chess.min.js"></script>
    <script src="/static/vendor/chessboard-1.0.0.min.js"></script>
    {% block scripts %}{% endblock %}
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</body>
</html>
