{% extends "base.html" %}
{% block title %}Train - Chess Trainer{% endblock %}

{% block content %}
<div class="training-container">
    <!-- Pre-session: start controls -->
    <div id="start-panel" class="panel">
        <h1>Training Session</h1>
        <div class="start-options">
            <div class="option-group">
                <label for="max-new">New cards</label>
                <input type="number" id="max-new" value="10" min="0" max="100">
            </div>
            <div class="option-group">
                <label for="max-reviews">Reviews</label>
                <input type="number" id="max-reviews" value="50" min="0" max="500">
            </div>
            <div class="option-group">
                <label for="include-tags">Tags (comma-separated)</label>
                <input type="text" id="include-tags" placeholder="e.g. fork, pin, my-weak-spots">
            </div>
            <div class="option-group">
                <label for="exercise-type-filter">Exercise type</label>
                <select id="exercise-type-filter">
                    <option value="">All types</option>
                    <option value="TACTIC">Tactics</option>
                    <option value="ENDGAME">Endgames</option>
                    <option value="OPENING">Openings</option>
                    <option value="POSITIONAL">Positional</option>
                </select>
            </div>
            <div class="option-group">
                <label for="duration">Duration (minutes, 0 = unlimited)</label>
                <input type="number" id="duration" value="0" min="0" max="120">
            </div>
            <div class="option-group">
                <label><input type="checkbox" id="hide-type"> Hide exercise type</label>
            </div>
        </div>
        <button id="start-btn" class="btn btn-primary btn-large" onclick="startSession()">
            Start Training
        </button>
        <div id="start-feedback" class="feedback" style="display: none;"></div>
    </div>

    <!-- Active session -->
    <div id="session-panel" class="panel" style="display: none;">
        <div class="exercise-header">
            <span id="progress-text">Exercise 1</span>
            <span id="exercise-type" class="dim"></span>
            <span id="timer-text" class="dim"></span>
            <span id="remaining-text" class="dim"></span>
        </div>

        <div class="board-area">
            <div id="board" class="board"></div>
        </div>

        <div id="challenge-text" class="challenge"></div>
        <div id="game-context" class="game-context" style="display: none;"></div>
        <div id="feedback-area" class="feedback" style="display: none;"></div>

        <!-- Rating panel (shown after exercise complete) -->
        <div id="rating-panel" class="rating-panel" style="display: none;">
            <div id="solution-text" class="solution"></div>
            <div class="rating-buttons">
                <button class="btn btn-again" onclick="rateExercise(1)">Again</button>
                <button class="btn btn-hard" onclick="rateExercise(2)">Hard</button>
                <button class="btn btn-good" onclick="rateExercise(3)">Good</button>
                <button class="btn btn-easy" onclick="rateExercise(4)">Easy</button>
            </div>
            <div id="next-review-text" class="dim" style="display: none;"></div>
        </div>

        <!-- Controls -->
        <div id="controls" class="controls">
            <button id="my-move-btn" class="btn btn-hint" onclick="showMyMove()" style="display: none;">What did I play?</button>
            <button class="btn btn-secondary" onclick="showSolution()">Show Solution</button>
            <button class="btn btn-secondary" onclick="endSession()">End Session</button>
        </div>
    </div>

    <!-- Session complete -->
    <div id="complete-panel" class="panel" style="display: none;">
        <h1>Session Complete</h1>
        <div class="stats-grid" id="session-stats"></div>
        <div class="action-panel">
            <a href="/train" class="btn btn-primary">New Session</a>
            <a href="/" class="btn btn-secondary">Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/training.js"></script>
{% endblock %}
