{% extends "base.html" %}
{% block title %}Register — Chess Trainer{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Register</h1>
    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/register" class="auth-form">
        <div class="form-group">
            <label for="invite_code">Invite Code</label>
            <input type="text" id="invite_code" name="invite_code" required autofocus>
        </div>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required
                   pattern="[a-zA-Z0-9_\-]{2,32}"
                   title="2-32 characters: letters, digits, hyphens, underscores">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="auth-link">Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}
