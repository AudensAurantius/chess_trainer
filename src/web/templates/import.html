{% extends "base.html" %}
{% block title %}Import — Chess Trainer{% endblock %}

{% block content %}
<div class="import-section">
    <h1>Import Exercises</h1>

    <div class="panel import-form">
        <h2>Lichess Puzzles</h2>
        <p class="dim">Import random tactical puzzles from Lichess.</p>

        <div class="import-fields">
            <div class="form-group">
                <label for="import-count">Count (max 100)</label>
                <input type="number" id="import-count" value="20" min="1" max="100">
            </div>
            <div class="form-group">
                <label for="import-difficulty">Difficulty</label>
                <select id="import-difficulty">
                    <option value="">Any</option>
                    <option value="easiest">Easiest</option>
                    <option value="easier">Easier</option>
                    <option value="normal">Normal</option>
                    <option value="harder">Harder</option>
                    <option value="hardest">Hardest</option>
                </select>
            </div>
            <div class="form-group">
                <label for="import-themes">Themes (comma-separated)</label>
                <input type="text" id="import-themes" placeholder="e.g. fork, pin, mateIn2">
            </div>
        </div>

        <button id="import-btn" class="btn btn-primary" onclick="importPuzzles()">
            Import from Lichess
        </button>

        <div id="import-feedback" class="feedback" style="display: none;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function importPuzzles() {
    const btn = document.getElementById('import-btn');
    const feedback = document.getElementById('import-feedback');

    const count = parseInt(document.getElementById('import-count').value) || 20;
    const difficulty = document.getElementById('import-difficulty').value || null;
    const themesRaw = document.getElementById('import-themes').value.trim();
    const themes = themesRaw ? themesRaw.split(',').map(t => t.trim()).filter(t => t) : null;

    btn.disabled = true;
    btn.textContent = 'Importing...';
    feedback.style.display = 'none';

    try {
        const body = { count };
        if (difficulty) body.difficulty = difficulty;
        if (themes && themes.length > 0) body.themes = themes;

        const res = await fetch('/api/import/lichess', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
            feedback.textContent = data.error || 'Import failed.';
            feedback.className = 'feedback feedback-wrong';
        } else {
            let msg = `Added ${data.added} puzzles`;
            if (data.skipped > 0) msg += `, ${data.skipped} skipped (duplicates)`;
            if (data.errors > 0) msg += `, ${data.errors} errors`;
            msg += '.';
            feedback.textContent = msg;
            feedback.className = 'feedback feedback-correct';
        }
        feedback.style.display = 'block';
    } catch (error) {
        feedback.textContent = 'Import failed: ' + error.message;
        feedback.className = 'feedback feedback-wrong';
        feedback.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Import from Lichess';
    }
}
</script>
{% endblock %}
