[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-trainer"
version = "0.1.0"
description = "Spaced repetition training system for chess improvement"
readme = "claude.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "chess>=1.10",
    "dataclasses-json>=0.6",
    "duckdb>=0.9",
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ipython>=8.0",
    "ruff>=0.4",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
analysis = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
chess-trainer = "src.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "D"]
ignore = ["E501", "D100", "D104", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
