[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[project]
name = "chess-trainer"
version = "0.1.0a1"
description = "Spaced repetition training system for chess improvement"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Michael Haynes", email = "mhaynes@boldorange.com"}]
keywords = ["chess", "training", "spaced-repetition", "fsrs", "lichess", "tactics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "chess>=1.10",
    "dataclasses-json>=0.6",
    "duckdb>=0.9",
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
analysis = [
    "pandas>=2.0",
    "numpy>=1.24",
]
vision-claude = ["anthropic>=0.39"]
vision-openai = ["openai>=1.50"]
vision-local = ["onnxruntime>=1.17", "pillow>=10.0", "numpy>=1.24"]
vision = [
    "chess-trainer[vision-claude,vision-openai,vision-local]",
]

[project.urls]
Homepage = "https://github.com/AudensAurantius/chess_trainer"
Repository = "https://github.com/AudensAurantius/chess_trainer"
Issues = "https://github.com/AudensAurantius/chess_trainer/issues"

[project.scripts]
chess-trainer = "src.cli.app:main"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ipython>=8.0",
    "ruff>=0.4",
    "pyfzf>=0.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "D"]
ignore = ["E501", "D100", "D104", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
