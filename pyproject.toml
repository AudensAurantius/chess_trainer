[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-trainer"
version = "0.1.0"
description = "Spaced repetition training system for chess improvement"
readme = "claude.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "chess>=1.10",
    "duckdb>=0.9",
    "requests>=2.28",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ipython>=8.0",
]
viz = [
    "pygame>=2.0",
    "chess-board>=0.3",
]
analysis = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
chess-trainer = "src.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
